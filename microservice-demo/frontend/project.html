<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Project - MicroOps</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;450&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = { darkMode: "class", theme: { extend: {
    colors: {
        "background": "rgb(var(--background) / <alpha-value>)",
        "surface": "rgb(var(--surface) / <alpha-value>)",
        "surface-container-lowest": "rgb(var(--surface-container-lowest) / <alpha-value>)",
        "surface-container-low": "rgb(var(--surface-container-low) / <alpha-value>)",
        "surface-container": "rgb(var(--surface-container) / <alpha-value>)",
        "surface-container-high": "rgb(var(--surface-container-high) / <alpha-value>)",
        "on-surface": "rgb(var(--on-surface) / <alpha-value>)",
        "on-surface-variant": "rgb(var(--on-surface-variant) / <alpha-value>)",
        "outline-variant": "rgb(var(--outline-variant) / <alpha-value>)",
        "primary": "rgb(var(--primary) / <alpha-value>)",
        "on-primary": "rgb(var(--on-primary) / <alpha-value>)",
        "primary-container": "rgb(var(--primary-container) / <alpha-value>)",
        "on-primary-container": "rgb(var(--on-primary-container) / <alpha-value>)",
        "secondary": "rgb(var(--secondary) / <alpha-value>)",
        "error": "rgb(var(--error) / <alpha-value>)"
      },
    spacing: { xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "40px" },
  } } };
</script>

<style id="theme-vars">
    :root {
        --background: 247 248 250;
            --surface: 255 255 255;
            --surface-container-lowest: 255 255 255;
            --surface-container-low: 247 248 250;
            --surface-container: 241 242 244;
            --surface-container-high: 235 236 239;
            --on-surface: 18 21 28;
            --on-surface-variant: 75 81 99;
            --outline-variant: 215 217 222;
            --primary: 79 70 229;
            --on-primary: 255 255 255;
            --primary-container: 224 225 255;
            --on-primary-container: 30 27 75;
            --secondary: 8 145 168;
            --error: 220 38 38;
    }
    html.dark {
        --background: 16 19 26;
            --surface: 16 19 26;
            --surface-container-lowest: 11 14 20;
            --surface-container-low: 25 28 34;
            --surface-container: 29 32 38;
            --surface-container-high: 39 42 49;
            --on-surface: 225 226 235;
            --on-surface-variant: 199 196 215;
            --outline-variant: 70 69 84;
            --primary: 192 193 255;
            --on-primary: 16 0 169;
            --primary-container: 128 131 255;
            --on-primary-container: 13 0 150;
            --secondary: 93 230 255;
            --error: 255 180 171;
    }
</style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen flex">
<div id="shell"></div>
<main class="flex-1 flex flex-col h-screen overflow-y-auto">
  <div class="p-lg md:p-xl max-w-6xl mx-auto w-full flex-1 flex flex-col gap-lg">
    <nav class="flex items-center gap-xs font-mono text-xs text-on-surface-variant">
      <a class="hover:text-primary" href="dashboard.html">Projects</a>
      <span class="material-symbols-outlined text-sm">chevron_right</span>
      <span id="breadcrumbName" class="text-on-surface">…</span>
    </nav>

    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-md border-b border-outline-variant pb-md">
      <div>
        <h1 id="projectTitle" class="text-3xl font-bold text-on-surface mb-xs">Loading…</h1>
        <p class="text-on-surface-variant text-sm">Tasks and tags for this project.</p>
      </div>
      <button onclick="openTaskModal()" class="px-md py-sm bg-primary text-on-primary font-semibold rounded-lg flex items-center gap-sm">
        <span class="material-symbols-outlined text-[18px]">add</span> New Task
      </button>
    </div>

    <div class="flex items-center flex-wrap gap-sm">
      <span class="font-mono text-xs text-on-surface-variant mr-sm">Tags:</span>
      <div id="tagList" class="flex items-center flex-wrap gap-xs"></div>
      <button onclick="addTagPrompt()" class="flex items-center gap-xs px-sm py-xs rounded-full border border-outline-variant border-dashed text-on-surface-variant hover:text-on-surface hover:border-on-surface text-xs">
        <span class="material-symbols-outlined text-[14px]">add</span> Add Tag
      </button>
    </div>
    <p class="text-xs text-on-surface-variant/60">Note: tags are stored in this browser only — the backend has no create-tag REST endpoint yet.</p>

    <div class="flex items-center gap-sm">
      <label class="text-xs text-on-surface-variant">Filter by tag</label>
      <select id="tagFilter" class="bg-surface-container-low border border-outline-variant rounded px-sm py-xs text-sm text-on-surface"><option value="">All</option></select>
      <label class="text-xs text-on-surface-variant ml-md">Assigned user</label>
      <input id="assigneeFilter" class="bg-surface-container-low border border-outline-variant rounded px-sm py-xs text-sm text-on-surface font-mono" placeholder="user id" type="text"/>
      <button onclick="loadTasks()" class="px-sm py-xs border border-outline-variant rounded text-xs text-on-surface-variant hover:text-on-surface">Apply</button>
    </div>

    <div class="bg-surface border border-outline-variant rounded-lg overflow-hidden">
      <table class="w-full text-left">
        <thead>
          <tr class="border-b border-outline-variant bg-surface-container-high text-xs uppercase text-on-surface-variant">
            <th class="p-sm">Task</th><th class="p-sm">Tag</th><th class="p-sm">Assigned To</th><th class="p-sm text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="taskRows"></tbody>
      </table>
      <p id="noTasks" class="hidden text-center text-sm text-on-surface-variant p-lg">No tasks yet.</p>
    </div>
  </div>
</main>

<!-- New/Edit Task Modal -->
<dialog class="bg-transparent m-auto p-0 backdrop:bg-black/50 backdrop:backdrop-blur-sm" id="taskModal">
  <div class="bg-surface border border-outline-variant rounded-xl w-[480px] max-w-[90vw] shadow-2xl flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-lg py-md border-b border-outline-variant bg-surface-container-low">
      <h2 id="taskModalTitle" class="font-bold text-on-surface">New Task</h2>
      <button onclick="closeTaskModal()" class="text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="taskForm" class="p-lg flex flex-col gap-md">
      <input type="hidden" id="taskId" name="task_id"/>
      <div class="flex flex-col gap-xs">
        <label class="text-xs font-bold uppercase text-on-surface-variant">Task Name</label>
        <input id="taskName" name="name" class="bg-surface-container border border-outline-variant rounded-md px-md py-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="e.g. Optimize Redis cache hit rate" required type="text"/>
      </div>
      <div class="flex gap-md">
        <div class="flex flex-col gap-xs flex-1">
          <label class="text-xs font-bold uppercase text-on-surface-variant">Assignee (user id)</label>
          <input id="taskAssignee" name="assigned_user_id" class="bg-surface-container border border-outline-variant rounded-md px-md py-sm text-on-surface font-mono focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="optional" type="text"/>
        </div>
        <div class="flex flex-col gap-xs flex-1">
          <label class="text-xs font-bold uppercase text-on-surface-variant">Tag</label>
          <select id="taskTag" name="tag_id" class="bg-surface-container border border-outline-variant rounded-md px-md py-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none"><option value="">None</option></select>
        </div>
      </div>
      <div class="flex justify-end gap-sm mt-lg pt-md border-t border-outline-variant">
        <button type="button" onclick="closeTaskModal()" class="px-md py-sm rounded-lg text-xs uppercase text-on-surface-variant border border-outline-variant hover:bg-surface-container-high">Cancel</button>
        <button type="submit" class="px-md py-sm rounded-lg text-xs uppercase bg-primary text-on-primary flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]">save</span> Save Task</button>
      </div>
    </form>
  </div>
</dialog>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
  Session.requireAuth();
  renderShell('dashboard');

  const projectId = new URLSearchParams(location.search).get('id');
  if (!projectId) location.href = 'dashboard.html';

  let project = ProjectCache.get(projectId);

  function renderTags() {
    const tags = project.tags || [];
    document.getElementById('tagList').innerHTML = tags.map(t => `
      <span class="flex items-center gap-xs bg-primary/10 border border-primary/30 px-sm py-xs rounded-full text-primary font-mono text-xs">
        <span class="w-2 h-2 rounded-full bg-primary"></span>${t.name}
      </span>`).join('');
    const tagOptions = tags.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    document.getElementById('taskTag').innerHTML = '<option value="">None</option>' + tagOptions;
    document.getElementById('tagFilter').innerHTML = '<option value="">All</option>' + tagOptions;
  }

  function addTagPrompt() {
    const name = prompt('Tag name:');
    if (!name) return;
    ProjectCache.addTag(projectId, { id: 'local-' + Date.now(), name });
    project = ProjectCache.get(projectId);
    renderTags();
  }

  function taskRow(t) {
    const tagName = (project.tags || []).find(tag => tag.id === t.tag_id)?.name || '—';
    return `
      <tr class="border-b border-outline-variant hover:bg-surface-container-high">
        <td class="p-sm text-on-surface">${t.name}</td>
        <td class="p-sm text-on-surface-variant font-mono text-xs">${tagName}</td>
        <td class="p-sm text-on-surface-variant font-mono text-xs">${t.assigned_user_id || 'Unassigned'}</td>
        <td class="p-sm text-right">
          <button onclick='openTaskModal(${JSON.stringify(t)})' class="text-on-surface-variant hover:text-primary text-xs">Edit</button>
        </td>
      </tr>`;
  }

  async function loadTasks() {
    const assignee = document.getElementById('assigneeFilter').value.trim();
    const tag = document.getElementById('tagFilter').value;
    const { tasks } = await Api.listTasks(projectId, assignee, tag);
    const rows = document.getElementById('taskRows');
    const empty = document.getElementById('noTasks');
    rows.innerHTML = (tasks || []).map(taskRow).join('');
    empty.classList.toggle('hidden', (tasks || []).length > 0);
  }

  const taskModal = document.getElementById('taskModal');
  function openTaskModal(task) {
    document.getElementById('taskForm').reset();
    document.getElementById('taskModalTitle').textContent = task ? 'Edit Task' : 'New Task';
    document.getElementById('taskId').value = task?.id || '';
    if (task) {
      document.getElementById('taskName').value = task.name;
      document.getElementById('taskAssignee').value = task.assigned_user_id || '';
      document.getElementById('taskTag').value = task.tag_id || '';
    }
    taskModal.showModal();
  }
  function closeTaskModal() { taskModal.close(); }

  document.getElementById('taskForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const taskId = f.get('task_id');
    try {
      if (taskId) {
        await Api.updateTask({
          user_id: Session.user.id, task_id: taskId,
          tag_id: f.get('tag_id'), assigned_user_id: f.get('assigned_user_id'),
        });
      } else {
        await Api.createTask({
          user_id: Session.user.id, name: f.get('name'), project_id: projectId,
          tag_id: f.get('tag_id'), assigned_user_id: f.get('assigned_user_id'),
        });
      }
      closeTaskModal();
      loadTasks();
    } catch (err) { alert(err.message); }
  });

  (async function init() {
    try {
      project = ProjectCache.upsert(await Api.getProject(projectId));
    } catch { /* fall back to cached copy if GET fails */ }
    if (!project) { location.href = 'dashboard.html'; return; }
    document.getElementById('projectTitle').textContent = project.name;
    document.getElementById('breadcrumbName').textContent = project.name;
    renderTags();
    loadTasks();
  })();
</script>
<script src="js/theme.js"></script>
</body>
</html>
