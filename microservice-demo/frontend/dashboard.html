<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Projects - MicroOps</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;450&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = { darkMode: "class", theme: { extend: {
    colors: {
        "background": "rgb(var(--background) / <alpha-value>)",
        "surface": "rgb(var(--surface) / <alpha-value>)",
        "surface-container-lowest": "rgb(var(--surface-container-lowest) / <alpha-value>)",
        "surface-container-low": "rgb(var(--surface-container-low) / <alpha-value>)",
        "surface-container": "rgb(var(--surface-container) / <alpha-value>)",
        "surface-container-high": "rgb(var(--surface-container-high) / <alpha-value>)",
        "on-surface": "rgb(var(--on-surface) / <alpha-value>)",
        "on-surface-variant": "rgb(var(--on-surface-variant) / <alpha-value>)",
        "outline-variant": "rgb(var(--outline-variant) / <alpha-value>)",
        "primary": "rgb(var(--primary) / <alpha-value>)",
        "on-primary": "rgb(var(--on-primary) / <alpha-value>)",
        "primary-container": "rgb(var(--primary-container) / <alpha-value>)",
        "on-primary-container": "rgb(var(--on-primary-container) / <alpha-value>)",
        "secondary": "rgb(var(--secondary) / <alpha-value>)",
        "error": "rgb(var(--error) / <alpha-value>)"
      },
    spacing: { xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "40px" },
    fontFamily: { label: ["Inter"] },
  } } };
</script>

<style id="theme-vars">
    :root {
        --background: 247 248 250;
            --surface: 255 255 255;
            --surface-container-lowest: 255 255 255;
            --surface-container-low: 247 248 250;
            --surface-container: 241 242 244;
            --surface-container-high: 235 236 239;
            --on-surface: 18 21 28;
            --on-surface-variant: 75 81 99;
            --outline-variant: 215 217 222;
            --primary: 79 70 229;
            --on-primary: 255 255 255;
            --primary-container: 224 225 255;
            --on-primary-container: 30 27 75;
            --secondary: 8 145 168;
            --error: 220 38 38;
    }
    html.dark {
        --background: 16 19 26;
            --surface: 16 19 26;
            --surface-container-lowest: 11 14 20;
            --surface-container-low: 25 28 34;
            --surface-container: 29 32 38;
            --surface-container-high: 39 42 49;
            --on-surface: 225 226 235;
            --on-surface-variant: 199 196 215;
            --outline-variant: 70 69 84;
            --primary: 192 193 255;
            --on-primary: 16 0 169;
            --primary-container: 128 131 255;
            --on-primary-container: 13 0 150;
            --secondary: 93 230 255;
            --error: 255 180 171;
    }
</style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen flex">
<div id="shell"></div>
<main class="flex-1 flex flex-col h-screen overflow-y-auto">
  <div class="p-lg md:p-xl max-w-7xl mx-auto w-full flex-1">
    <div class="flex justify-between items-end mb-lg">
      <div>
        <h2 class="text-3xl font-bold text-on-surface mb-xs">Projects</h2>
        <p class="text-on-surface-variant">Manage and monitor your projects.</p>
      </div>
      <button onclick="openModal()" class="px-md py-sm bg-primary text-on-primary font-semibold rounded-lg flex items-center gap-sm hover:bg-primary-container transition-colors">
        <span class="material-symbols-outlined text-[18px]">add</span> New Project
      </button>
    </div>
    <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md"></div>
    <p class="text-xs text-on-surface-variant/60 mt-lg">Note: project list is cached in this browser only — the backend has no list-all-projects endpoint yet.</p>
  </div>
</main>

<div class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-md" id="newProjectModal">
  <div class="bg-surface border border-outline-variant rounded-lg shadow-2xl w-full max-w-md flex flex-col" onclick="event.stopPropagation()">
    <div class="px-lg py-md border-b border-outline-variant flex justify-between items-center">
      <h2 class="font-bold text-on-surface">New Project</h2>
      <button onclick="closeModal()" class="text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form class="p-lg flex flex-col gap-md" id="createProjectForm">
      <div class="flex flex-col gap-xs">
        <label class="text-xs font-bold uppercase text-on-surface-variant" for="projectName">Project Name</label>
        <input class="bg-surface-container-lowest border border-outline-variant rounded px-sm py-xs font-mono text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="projectName" name="name" placeholder="e.g. payment-gateway" required type="text"/>
      </div>
      <div id="createProjectError" class="hidden text-error text-sm"></div>
      <div class="flex justify-end gap-sm mt-md pt-md border-t border-outline-variant">
        <button type="button" onclick="closeModal()" class="px-md py-sm border border-outline-variant rounded text-on-surface hover:bg-surface-container-high">Cancel</button>
        <button type="submit" class="px-md py-sm bg-primary text-on-primary font-semibold rounded flex items-center gap-xs">
          <span class="material-symbols-outlined text-[18px]">add_circle</span> Create Project
        </button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
  Session.requireAuth();
  renderShell('dashboard');

  function projectCard(p) {
    const tagCount = (p.tags || []).length;
    return `
      <a href="project.html?id=${p.id}" class="bg-surface border border-outline-variant rounded-lg p-md flex flex-col hover:bg-surface-container-high transition-colors">
        <div class="flex items-center gap-sm mb-md">
          <div class="w-10 h-10 rounded-md bg-primary/10 flex items-center justify-center border border-primary/20 text-primary">
            <span class="material-symbols-outlined">folder_managed</span>
          </div>
          <h3 class="font-semibold text-on-surface">${p.name}</h3>
        </div>
        <div class="flex items-center justify-between text-xs text-on-surface-variant border-t border-outline-variant pt-sm mt-auto">
          <span>${tagCount} tag${tagCount === 1 ? '' : 's'}</span>
          <span class="font-mono">${p.id.slice(0, 8)}</span>
        </div>
      </a>`;
  }

  function renderProjects() {
    const grid = document.getElementById('projectsGrid');
    const projects = ProjectCache.list();
    grid.innerHTML = projects.map(projectCard).join('') || `
      <div class="col-span-full text-on-surface-variant text-sm border border-dashed border-outline-variant rounded-lg p-lg text-center">
        No projects yet. Create one to get started.
      </div>`;
  }
  renderProjects();

  const modal = document.getElementById('newProjectModal');
  function openModal() { modal.classList.remove('hidden'); modal.classList.add('flex'); }
  function closeModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); document.getElementById('createProjectForm').reset(); }
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  document.getElementById('createProjectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = new FormData(e.target).get('name');
    const errEl = document.getElementById('createProjectError');
    errEl.classList.add('hidden');
    try {
      const project = await Api.createProject(Session.user.id, name);
      ProjectCache.upsert(project);
      closeModal();
      renderProjects();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  });
</script>
<script src="js/theme.js"></script>
</body>
</html>
