<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MicroOps - Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;450&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        "background": "rgb(var(--background) / <alpha-value>)",
        "surface": "rgb(var(--surface) / <alpha-value>)",
        "surface-container-lowest": "rgb(var(--surface-container-lowest) / <alpha-value>)",
        "surface-container-low": "rgb(var(--surface-container-low) / <alpha-value>)",
        "surface-container": "rgb(var(--surface-container) / <alpha-value>)",
        "surface-container-high": "rgb(var(--surface-container-high) / <alpha-value>)",
        "on-surface": "rgb(var(--on-surface) / <alpha-value>)",
        "on-surface-variant": "rgb(var(--on-surface-variant) / <alpha-value>)",
        "outline-variant": "rgb(var(--outline-variant) / <alpha-value>)",
        "primary": "rgb(var(--primary) / <alpha-value>)",
        "on-primary": "rgb(var(--on-primary) / <alpha-value>)",
        "inverse-primary": "rgb(var(--inverse-primary) / <alpha-value>)",
        "primary-fixed": "rgb(var(--primary-fixed) / <alpha-value>)",
        "secondary": "rgb(var(--secondary) / <alpha-value>)",
        "tertiary": "rgb(var(--tertiary) / <alpha-value>)",
        "error": "rgb(var(--error) / <alpha-value>)"
      },
      spacing: { xs: "4px", sm: "8px", md: "16px", lg: "24px", xl: "40px" },
      fontFamily: { headline: ["Inter"], body: ["Inter"], code: ["JetBrains Mono"], caps: ["Inter"] },
    } }
  };
</script>
<style>
  .glowing-bg { background: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15), transparent 70%); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>

<style id="theme-vars">
    :root {
        --background: 247 248 250;
            --surface: 255 255 255;
            --surface-container-lowest: 255 255 255;
            --surface-container-low: 247 248 250;
            --surface-container: 241 242 244;
            --surface-container-high: 235 236 239;
            --on-surface: 18 21 28;
            --on-surface-variant: 75 81 99;
            --outline-variant: 215 217 222;
            --primary: 79 70 229;
            --on-primary: 255 255 255;
            --inverse-primary: 192 193 255;
            --primary-fixed: 224 225 255;
            --secondary: 8 145 168;
            --tertiary: 91 100 114;
            --error: 220 38 38;
    }
    html.dark {
        --background: 16 19 26;
            --surface: 16 19 26;
            --surface-container-lowest: 11 14 20;
            --surface-container-low: 25 28 34;
            --surface-container: 29 32 38;
            --surface-container-high: 39 42 49;
            --on-surface: 225 226 235;
            --on-surface-variant: 199 196 215;
            --outline-variant: 70 69 84;
            --primary: 192 193 255;
            --on-primary: 16 0 169;
            --inverse-primary: 73 75 214;
            --primary-fixed: 225 224 255;
            --secondary: 93 230 255;
            --tertiary: 194 198 212;
            --error: 255 180 171;
    }
</style>
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center font-body relative overflow-hidden">
<div class="absolute inset-0 z-0 pointer-events-none glowing-bg"></div>
<div class="relative z-10 w-full max-w-md px-md">
  <button onclick="toggleTheme()" class="absolute top-lg right-lg text-on-surface-variant hover:text-on-surface p-sm rounded-full hover:bg-surface-container-high transition-colors">
    <span class="material-symbols-outlined theme-toggle-icon">dark_mode</span>
  </button>
  <div class="text-center mb-xl">
    <h1 class="text-3xl font-headline font-bold text-primary flex items-center justify-center gap-sm">
      <span class="material-symbols-outlined">terminal</span> MicroOps
    </h1>
    <p class="text-on-surface-variant mt-sm">Platform Engineering Portal</p>
  </div>

  <div class="bg-surface rounded-lg border border-outline-variant p-lg shadow-[0_4px_24px_rgba(0,0,0,0.4)]">
    <div class="flex border-b border-outline-variant mb-lg">
      <button class="flex-1 pb-sm text-xs font-bold uppercase tracking-wide text-primary border-b-2 border-primary" id="tab-login" onclick="switchTab('login')">LOGIN</button>
      <button class="flex-1 pb-sm text-xs font-bold uppercase tracking-wide text-on-surface-variant border-b-2 border-transparent" id="tab-register" onclick="switchTab('register')">REGISTER</button>
    </div>

    <div id="error-banner" class="hidden mb-md p-sm bg-error/10 border border-error/30 rounded text-error text-sm"></div>

    <!-- Login -->
    <div class="tab-content active" id="content-login">
      <form class="flex flex-col gap-md" id="loginForm">
        <div>
          <label class="block text-xs font-bold uppercase text-on-surface-variant mb-xs">Email Address</label>
          <input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" name="email" placeholder="admin@microops.local" required type="email"/>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-on-surface-variant mb-xs">Password</label>
          <input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" name="password" placeholder="••••••••" required type="password"/>
        </div>
        <div class="font-code text-xs text-on-surface-variant/70 p-sm bg-surface-container-low rounded border border-outline-variant/50">
          <span class="text-tertiary">POST</span> /v1/user/login
        </div>
        <button class="w-full bg-[#6366F1] text-white font-semibold rounded py-sm hover:bg-inverse-primary transition-colors flex items-center justify-center gap-sm" type="submit">
          Authenticate <span class="material-symbols-outlined text-[18px]">login</span>
        </button>
      </form>
      <p class="text-center text-sm text-on-surface-variant mt-md">No account? <a class="text-primary" href="#" onclick="switchTab('register')">Register</a></p>
    </div>

    <!-- Register -->
    <div class="tab-content" id="content-register">
      <form class="flex flex-col gap-md" id="registerForm">
        <div>
          <label class="block text-xs font-bold uppercase text-on-surface-variant mb-xs">Full Name</label>
          <input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" name="name" placeholder="Jane Doe" required type="text"/>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-on-surface-variant mb-xs">Email Address</label>
          <input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" name="email" placeholder="jane@microops.local" required type="email"/>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-on-surface-variant mb-xs">Password</label>
          <input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" minlength="8" name="password" placeholder="••••••••" required type="password"/>
        </div>
        <div class="font-code text-xs text-on-surface-variant/70 p-sm bg-surface-container-low rounded border border-outline-variant/50">
          <span class="text-secondary">POST</span> /v1/user/register
        </div>
        <button class="w-full bg-transparent border border-outline-variant text-on-surface font-semibold rounded py-sm hover:border-primary hover:text-primary transition-colors flex items-center justify-center gap-sm" type="submit">
          Create Account <span class="material-symbols-outlined text-[18px]">person_add</span>
        </button>
      </form>
      <p class="text-center text-sm text-on-surface-variant mt-md">Already have an account? <a class="text-primary" href="#" onclick="switchTab('login')">Login</a></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  function switchTab(tab) {
    for (const t of ['login', 'register']) {
      document.getElementById('tab-' + t).className = 'flex-1 pb-sm text-xs font-bold uppercase tracking-wide text-on-surface-variant border-b-2 border-transparent';
      document.getElementById('content-' + t).classList.remove('active');
    }
    document.getElementById('tab-' + tab).className = 'flex-1 pb-sm text-xs font-bold uppercase tracking-wide text-primary border-b-2 border-primary';
    document.getElementById('content-' + tab).classList.add('active');
  }

  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  // If already logged in, skip straight to dashboard.
  if (Session.token) window.location.href = 'dashboard.html';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const user = await Api.login(f.get('email'), f.get('password'));
      Session.set(user);
      window.location.href = 'dashboard.html';
    } catch (err) { showError(err.message); }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const user = await Api.register(f.get('name'), f.get('email'), f.get('password'));
      Session.set(user);
      window.location.href = 'dashboard.html';
    } catch (err) { showError(err.message); }
  });
</script>
<script src="js/theme.js"></script>
</body>
</html>
